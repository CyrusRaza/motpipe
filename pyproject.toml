[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motpipe"
version = "0.1.0"
description = "Multi-object detection and tracking with swappable detectors and trackers (strategy pattern)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
]

[project.optional-dependencies]
yolov8 = ["ultralytics>=8.0"]
yolov5 = ["pandas", "requests", "pyyaml", "tqdm", "matplotlib", "seaborn", "ultralytics>=8.0", "gitpython"]
torchvision = ["torch", "torchvision"]
deepsort = ["deep-sort-realtime", "torch"]
bytetrack = ["trackers>=2.6.1,<3"]
all = ["motpipe[yolov8,yolov5,torchvision,deepsort,bytetrack]"]
dev = ["pytest", "ruff", "motpipe[bytetrack]"]

[project.scripts]
motpipe = "motpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["venv", "external_repos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
